<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        button { padding: 10px 20px; background: #18A0FB; color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <button id="export">Export Frame to UIKey</button>
    <script>
        document.getElementById('export').onclick = () => {
            parent.postMessage({ pluginMessage: { type: 'export' } }, '*');
        };
    </script>
</body>
</html>
